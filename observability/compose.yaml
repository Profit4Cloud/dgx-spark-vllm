name: observability

x-logging: &common-logging
  driver: local
  options:
    max-size: "20m"
    max-file: "3"

services:
  prometheus:
    image: prom/prometheus:v3.7.1
    logging: *common-logging
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0
    logging: *common-logging
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:4.6.1-4.8.4-distroless
    logging: *common-logging
    container_name: dcgm-exporter
    restart: unless-stopped
    gpus: all
    ports:
      - "127.0.0.1:9400:9400"

  node-exporter:
    image: prom/node-exporter:v1.12.1
    logging: *common-logging
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
    command:
      - '--path.procfs=/host/proc'
      - '--collector.disable-defaults'
      - '--collector.meminfo'
    expose:
      - "9100"

  phoenix:
    image: arizephoenix/phoenix:version-20.26.1
    logging: *common-logging
    container_name: phoenix
    restart: unless-stopped
    ports:
      - "127.0.0.1:6006:6006"
      - "127.0.0.1:4317:4317"
    environment:
      PHOENIX_WORKING_DIR: /data
    volumes:
      - phoenix-data:/data

volumes:
  prometheus-data:
    external: true
    name: ${PROMETHEUS_VOLUME:-dgx-vllm-prometheus-data}
  grafana-data:
    external: true
    name: ${GRAFANA_VOLUME:-dgx-vllm-grafana-data}
  phoenix-data:
    external: true
    name: ${PHOENIX_VOLUME:-dgx-vllm-phoenix-data}

networks:
  default:
    name: dgx-observability
