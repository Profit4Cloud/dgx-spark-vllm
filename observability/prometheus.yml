global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: vllm
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*.yml
        refresh_interval: 5s

  - job_name: dcgm-exporter
    static_configs:
      - targets: ['dcgm-exporter:9400']

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']
