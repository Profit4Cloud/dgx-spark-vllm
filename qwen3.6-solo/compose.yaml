name: qwen36-solo

x-logging: &common-logging
  driver: local
  options:
    max-size: "20m"
    max-file: "3"

services:
  qwen3.6-35b-a3b:
    image: vllm/vllm-openai:v0.32.0
    networks:
      default:
        aliases:
          - qwen36-solo-35b
    logging: *common-logging
    entrypoint:
      - vllm
      - serve
    command:
      - nvidia/Qwen3.6-35B-A3B-NVFP4
      - --port
      - "8001"
      - --trust-remote-code
      - --kv-cache-dtype
      - fp8
      - --attention-backend
      - flashinfer
      - --moe-backend
      - marlin
      - --gpu-memory-utilization
      - '0.25'
      - --max-model-len
      - '32768'
      - --max-num-seqs
      - '4'
      - --max-num-batched-tokens
      - '8192'
      - --enable-chunked-prefill
      - --async-scheduling
      - --enable-prefix-caching
      - --load-format
      - fastsafetensors
      - --tensor-parallel-size
      - '1'
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --reasoning-parser
      - qwen3
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":3,"moe_backend":"triton"}'
      - --language-model-only
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 300s
    ports:
      - "127.0.0.1:${QWEN36_PORT:-8001}:8001"
    restart: unless-stopped
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_HUB_CACHE: /root/.cache/huggingface
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      VLLM_NO_USAGE_STATS: '1'
      DO_NOT_TRACK:   '1'
      RAY_USAGE_STATS_ENABLED: '0'
      PYTHONUNBUFFERED: '1'
      VLLM_CACHE_ROOT: /root/.cache/vllm
      VLLM_FLASHINFER_AUTOTUNE_CACHE_DIR: /root/.cache/flashinfer/autotune
    volumes:
      - ${HOME}/.cache/huggingface/hub:/root/.cache/huggingface
      - ${HOME}/.cache/vllm:/root/.cache/vllm
      - ${HOME}/.cache/flashinfer/autotune:/root/.cache/flashinfer/autotune
    ipc: host
    gpus: all

networks:
  default:
    name: dgx-observability
    external: true
